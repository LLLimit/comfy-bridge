name: Bug report
description: 报告可重现的错误
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。安全漏洞请使用 Security 页面的私密报告，不要在此公开。
  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      options: [Android App, Windows Agent, Workflow pack, Documentation, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v1.3.0 / commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows、Android、Flutter、Python、ComfyUI 版本及相关自定义节点。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先删除 Token、凭据、本机路径和其他隐私信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现重复报告。
          required: true
        - label: 我已从日志中删除 Token、凭据和隐私信息。
          required: true
