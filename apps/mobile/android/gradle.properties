org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter/pub dependencies are cached on C: while this project lives on F:.
# Kotlin incremental caches cannot relativize sources across Windows drive roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# These compatibility flags are currently emitted by the Flutter template.
android.newDsl=false
android.builtInKotlin=false
